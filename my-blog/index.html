---
layout: default
title: Home
---

{% for post in site.posts %}
    <article style="margin-bottom: 60px;">
        <span class="post-date">{{ post.date | date: "%B %d, %Y" }}</span>
        <h2 style="font-size: 2rem; margin-top: 0; margin-bottom: 15px;">
            <a href="{{ post.url }}">{{ post.title }}</a>
        </h2>
        <div class="post-excerpt">
            {{ post.excerpt }}
        </div>
        <a href="{{ post.url }}" style="font-weight: bold; font-size: 0.9rem;">Read Entry &rarr;</a>
    </article>
{% endfor %}
